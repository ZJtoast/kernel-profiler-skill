architectures:
  Tesla:
    years: "2006-2010"
    representative_chips: [G80, GT200]
    profiling_relevance: legacy
  Fermi:
    years: "2010-2012"
    representative_chips: [GF100, GF110]
    profiling_relevance: legacy_cache_and_shared_memory
  Kepler:
    years: "2012-2015"
    representative_chips: [GK104, GK110, GK210]
    profiling_relevance: large_smx_register_occupancy
  Maxwell:
    years: "2014-2016"
    representative_chips: [GM107, GM204, GM200]
    profiling_relevance: resident_block_limit_and_cache_behavior
  Pascal:
    years: "2016-2018"
    representative_chips: [GP100, GP102, GP104, GP106]
    profiling_relevance: hbm2_vs_gddr5x_memory_bound_analysis
  Volta:
    years: "2017-2019"
    representative_chips: [GV100]
    profiling_relevance: tensor_core_generation_1_and_independent_thread_scheduling
  Turing:
    years: "2018-2020"
    representative_chips: [TU102, TU104, TU106, TU117]
    profiling_relevance: tensor_core_generation_2_and_lower_threads_per_sm
  Ampere:
    years: "2020-2022"
    representative_chips: [GA100, GA102, GA104, GA106, GA10B]
    profiling_relevance: tf32_tensor_cores_cp_async_large_shared_memory
  Ada:
    years: "2022-2024"
    representative_chips: [AD102, AD103, AD104, AD106, AD107]
    profiling_relevance: large_l2_cache_and_fourth_gen_tensor_cores
  Hopper:
    years: "2022-2025"
    representative_chips: [GH100]
    profiling_relevance: wgmma_tma_clusters_dsm_hbm3
  Blackwell:
    years: "2024-"
    representative_chips: [GB100, GB102, GB202, GB203, GB205, GB206, GB207]
    profiling_relevance: fp4_fp8_transformer_engine_wgmma_tma_dual_die_datacenter

