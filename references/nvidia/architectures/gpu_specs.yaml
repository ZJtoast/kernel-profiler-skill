profile_implications:
  occupancy:
    required_fields:
      - compute_capability
      - max_threads_per_sm
      - max_warps_per_sm
      - max_resident_blocks_per_sm
      - registers_32bit_per_sm
      - max_shared_memory_per_sm_kb
    report_rule: >
      When theoretical occupancy is low, cite the exact limiting resource: registers, shared memory,
      block count, thread count, or warp count. If achieved occupancy is much lower than theoretical,
      inspect workload imbalance, launch count, early exits, and scheduler statistics.
  memory_bandwidth:
    required_fields:
      - memory_type
      - memory_bandwidth_gbps
      - l2_cache_mb
    report_rule: >
      Compare DRAM throughput to product-level bandwidth. If L2 throughput is high but DRAM throughput
      is moderate, classify as L2/cache pressure rather than pure DRAM bandwidth bound.
  tensor_compute:
    required_fields:
      - tensor_core_generation
      - compute_capability
    report_rule: >
      Matrix-heavy kernels must show expected tensor instruction family for the architecture:
      HMMA on Volta/Turing/Ampere, WGMMA on Hopper/Blackwell when using warp-group kernels.
  source_hotspots:
    required_fields:
      - source_mapping_available
      - sass_available
    report_rule: >
      Every primary bottleneck should map to at least one source line, SASS opcode family, or a clear
      explanation why source attribution was unavailable.
