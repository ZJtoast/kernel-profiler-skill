schema_version: 1.0
purpose: >
  Machine-readable NVIDIA GPU architecture, chip, and product database for kernel-only profiling.
  Agents must prefer runtime profiler/device metadata over this static database when values disagree.
units:
  sm_count: count
  max_threads_per_sm: threads
  max_warps_per_sm: warps
  registers_32bit_per_sm: 32bit_registers
  shared_memory_kb: KiB
  l1_cache_kb: KiB
  l2_cache_mb: MiB
  memory_bandwidth_gbps: GB_per_second_decimal
  memory_capacity_gb: GB_decimal_or_vendor_advertised
source_policy:
  official_first: true
  missing_value: null
  runtime_override: true
  citation_style: store_source_key
sources:
  cuda_programming_guide_compute_capabilities:
    type: official
    url_hint: NVIDIA CUDA C++ Programming Guide, Compute Capabilities appendix
    use_for: compute capability limits, threads, warps, registers, shared memory
  nvidia_cuda_gpus:
    type: official
    url_hint: NVIDIA CUDA GPUs compute capability table
    use_for: product-to-compute-capability mapping
  nvidia_hopper_architecture_blog:
    type: official
    url_hint: NVIDIA Hopper Architecture In-Depth
    use_for: H100 die-level GPC/TPC/SM, HBM3, L2, Tensor Core generation
  nvidia_blackwell_architecture:
    type: official
    url_hint: NVIDIA Blackwell Architecture
    use_for: Blackwell transistor, dual-die, chip-to-chip interconnect, Transformer Engine
  nvidia_ada_whitepaper:
    type: official_pdf
    url_hint: NVIDIA Ada GPU Architecture whitepaper
    use_for: AD102 full-chip SM, L1, L2, register file, Tensor Core generation

compute_capability_classes:
  "1.x":
    architecture_family: Tesla
    warp_size: 32
    max_threads_per_block: 512
    max_threads_per_sm: 768
    max_warps_per_sm: 24
    max_resident_blocks_per_sm: 8
    registers_32bit_per_sm: 8192
    max_registers_32bit_per_thread: 124
    max_shared_memory_per_sm_kb: 16
    max_shared_memory_per_block_kb: 16
    l1_shared_combined_kb: null
    notes: Legacy reference only; do not expect modern ncu support.
    source: cuda_programming_guide_compute_capabilities
  "2.x":
    architecture_family: Fermi
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 1536
    max_warps_per_sm: 48
    max_resident_blocks_per_sm: 8
    registers_32bit_per_sm: 32768
    max_registers_32bit_per_thread: 63
    max_shared_memory_per_sm_kb: 48
    max_shared_memory_per_block_kb: 48
    l1_shared_combined_kb: 64
    notes: First generation with configurable L1/shared memory.
    source: cuda_programming_guide_compute_capabilities
  "3.x":
    architecture_family: Kepler
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 2048
    max_warps_per_sm: 64
    max_resident_blocks_per_sm: 16
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 48
    max_shared_memory_per_block_kb: 48
    l1_shared_combined_kb: null
    notes: Large SMX; occupancy often limited by register and block count.
    source: cuda_programming_guide_compute_capabilities
  "5.x":
    architecture_family: Maxwell
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 2048
    max_warps_per_sm: 64
    max_resident_blocks_per_sm: 32
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 96
    max_shared_memory_per_block_kb: 48
    l1_shared_combined_kb: 96
    notes: Higher resident-block limit than Kepler; cache behavior differs from Kepler.
    source: cuda_programming_guide_compute_capabilities
  "6.0":
    architecture_family: Pascal
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 2048
    max_warps_per_sm: 64
    max_resident_blocks_per_sm: 32
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 64
    max_shared_memory_per_block_kb: 48
    l1_shared_combined_kb: 64
    notes: GP100 datacenter profile; HBM2 bandwidth changes memory-bound thresholds.
    source: cuda_programming_guide_compute_capabilities
  "6.1":
    architecture_family: Pascal
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 2048
    max_warps_per_sm: 64
    max_resident_blocks_per_sm: 32
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 96
    max_shared_memory_per_block_kb: 48
    l1_shared_combined_kb: 96
    notes: GP102/GP104/GP106 consumer/workstation profile.
    source: cuda_programming_guide_compute_capabilities
  "7.0":
    architecture_family: Volta
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 2048
    max_warps_per_sm: 64
    max_resident_blocks_per_sm: 32
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 96
    max_shared_memory_per_block_kb: 96
    l1_shared_combined_kb: 128
    tensor_core_generation: 1
    independent_thread_scheduling: true
    notes: First Tensor Core generation; independent thread scheduling affects warp-synchronous assumptions.
    source: cuda_programming_guide_compute_capabilities
  "7.5":
    architecture_family: Turing
    warp_size: 32
    max_threads_per_block: 1024
    max_threads_per_sm: 1024
    max_warps_per_sm: 32
    max_resident_blocks_per_sm: 16
    registers_32bit_per_sm: 65536
    max_registers_32bit_per_thread: 255
    max_shared_memory_per_sm_kb: 64
    max_shared_memory_per_block_kb: 64
    l1_shared_combined_kb: 96
    tensor_core_generation: 2
    notes: Lower thread/warp residency per SM than Volta/Ampere datacenter.
    source: cuda_programming_guide_compute_capabilities
  "8.0":
