schema_version: 3.0

target:
  runtime: "native"                 # native | python | python-triton
  executable: "./app"
  working_directory: "."
  args: []
  env: {}
  stdin: null
  timeout_seconds: null
  python:
    interpreter: "python3"
    entry_kind: null               # script | module | command | null
    script: null
    module: null
    jit_framework: null            # triton when runtime is python-triton

runtime_options:
  triton_enabled: false
  triton_kernel_hint: null
  triton_autotune_policy: "warmup_or_fixed_config" # fixed_config | warmup_or_fixed_config | allow_autotune
  jit_warmup_required: false
  recommended_warmup_skip: 20
  require_cuda_synchronize_around_profile_window: true
  source_mapping_expectation: "best_effort"
  notes: []

kernel:
  name: null                     # human label; usually the kernel name from the request
  filter_mode: "regex"           # exact | regex | kernel-id | nvtx-range | vendor-specific | auto
  filter: null                   # default generator fills this as .*<escaped_kernel_name>.*
  profile_id: "auto"
  nvtx_range: null
  allow_discovery_fallback: true # run discovery only if filter is missing or matches no kernels

profiling:
  backend: "nvidia-ncu"
  initial_level: "basic"          # basic | full
  warmup_policy: "auto"           # auto | fixed | none
  warmup_skip: null
  launch_count: null
  enable_source_mapping: true
  enable_visual_report: false
  extra_profiler_options: []
  ncu_bin: "ncu"                   # set exact path, e.g. /usr/local/cuda-12.4/bin/ncu, after NOPASSWD setup
  output_root: "./profile"

privilege:
  mode: "none"                    # none | full_sudo
  full_sudo_policy: "root-or-nopasswd-only"
  password_storage: "forbidden"
  forbidden:
    - "Do not store sudo passwords in target files, scripts, logs, reports, environment variables, shell history, or commands."
    - "Do not pipe passwords into sudo, auto-type passwords, or read passwords from files."
    - "Do not use privilege for anything outside the profiling command path."

discovery:
  enabled_when_filter_missing: true
  fallback_when_kernel_filter_misses: true
  max_candidates: 20
  prefer_user_named_kernel: true
  rank_by: ["user_hint", "duration", "launch_count"]
  command_extra_options: []

analysis:
  collect_memory: "auto"
  collect_compute: "auto"
  collect_occupancy: "auto"
  collect_roofline: "auto"
  collect_source: "auto"
  enable_bottleneck_decision_engine: false
  enable_regression_compare: false
  compare_baseline: "auto"        # auto | explicit path | null
  random_variation_tolerance_pct: 2.0
  generate_source_hotspots_table: true

visualization:
  enabled: false
  format: "png"
  require_python_packages: ["pandas", "matplotlib", "pyyaml"]

notes:
  user_requirements: ""
  unsupported_or_deferred_requirements: []
